<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학습활동 추천 | 수업 준비 도우미</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/form-check.js" defer></script>
  <script src="js/csv.js" defer></script>
  <script src="js/copy-text.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>수업 준비 도우미<small>교사를 위한 수업 도구</small></span></a>
      <nav aria-label="수업 도구">
        <p class="nav-label">수업 도구</p>
        <a class="nav-link" href="quiz.html"><span aria-hidden="true">▤</span> 퀴즈 생성기</a>
        <a class="nav-link active" aria-current="page" href="activity.html"><span aria-hidden="true">◇</span> 학습활동 추천</a>
      </nav>
      <p class="sidebar-note">수업 준비를 위한<br>작은 아이디어부터 차근차근.</p>
    </aside>
    <main class="main">
      <header class="page-header">
        <span class="eyebrow">ACTIVITY IDEAS</span>
        <h1>학습활동 추천</h1>
        <p>우리 반에 어울리는 활동을 위한 정보를 입력해 주세요.</p>
      </header>
      <div class="workspace">
        <section class="card" aria-labelledby="form-title">
          <div class="card-heading"><span class="step">01</span><div><h2 id="form-title">활동 설정</h2><p>수업 상황에 맞게 항목을 채워 주세요.</p></div></div>
          <form class="input-form" data-preview-form data-kind="activity" novalidate>
            <div class="field"><label for="subject">과목 <span class="required">필수</span></label><input id="subject" name="과목" type="text" maxlength="30" required data-rule="30자 이내로"><span class="field-error" id="subject-error"></span></div>
            <div class="field"><label for="grade">학년 <span class="required">필수</span></label><select id="grade" name="학년" required data-rule="초1~고3 중 하나로"><option value="">학년을 선택해 주세요</option><option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select><span class="field-error" id="grade-error"></span></div>
            <div class="field"><label for="goal">학습 목표 <span class="required">필수</span></label><textarea id="goal" name="학습 목표" maxlength="200" rows="4" required data-rule="200자 이내로" placeholder="예: 식물의 각 부분이 하는 일을 설명할 수 있다."></textarea><span class="field-error" id="goal-error"></span></div>
            <div class="field"><label for="duration">활동 시간(분) <span class="required">필수</span></label><input id="duration" name="활동 시간(분)" type="number" min="5" max="50" step="1" value="20" required data-rule="5~50 사이 정수로"><span class="field-error" id="duration-error"></span></div>
            <div class="field"><label for="format">활동 형태 <span class="optional">선택</span></label><select id="format" name="활동 형태" data-rule="상관없음, 개인, 짝, 모둠, 전체 중 하나로"><option>상관없음</option><option>개인</option><option>짝</option><option>모둠</option><option>전체</option></select><span class="field-error" id="format-error"></span></div>
            <div class="field"><label for="group-size">모둠 인원 <span class="required">필수</span></label><input id="group-size" name="모둠 인원" type="number" min="2" max="6" step="1" required data-rule="2~6 사이 정수로" placeholder="2~6명"><span class="field-error" id="group-size-error"></span></div>
            <div class="field"><label for="supplies">쓸 수 있는 준비물 <span class="optional">선택</span></label><input id="supplies" name="쓸 수 있는 준비물" type="text" maxlength="200" data-rule="200자 이내로" placeholder="예: 포스트잇, 색연필"><span class="field-hint">준비물은 쉼표로 구분해 주세요.</span><span class="field-error" id="supplies-error"></span></div>
            <button type="submit">활동 추천 <span aria-hidden="true">→</span></button>
          </form>
        </section>
        <section class="card result-card" aria-labelledby="result-title">
          <div class="card-heading"><span class="step">02</span><div><h2 id="result-title">결과</h2><p>형식을 검증한 활동입니다.</p></div></div>
          <div class="result-content" aria-live="polite">
            <div class="empty-state" data-empty><span class="empty-icon" aria-hidden="true">✧</span><p>아직 결과가 없습니다. 입력 후 버튼을 눌러 주세요.</p></div>
            <p data-status role="status" hidden></p>
            <div data-result hidden></div>
            <button type="button" data-retry hidden>다시 시도</button>
          </div>
          <p class="prototype-note">AI가 만든 내용의 적합성을 수업 전에 확인해 주세요.</p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
